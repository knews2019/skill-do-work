    <text x="153" y="252" font-size="14" text-anchor="middle">Feb</text>
    <rect x="213" y="193.92" width="52" height="38.08" fill="#214e49"/>
    <rect x="213" y="155.84" width="52" height="38.08" fill="#548c77"/>
    <rect x="213" y="131.20" width="52" height="24.64" fill="#a6c5a3"/>
    <text x="239" y="125" font-size="15" text-anchor="middle" font-weight="650">45</text>
