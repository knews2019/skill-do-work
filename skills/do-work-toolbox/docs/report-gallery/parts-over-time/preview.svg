    <text x="26" y="63" font-size="15">Tires, brakes and gears</text>
    <defs><pattern id="partial" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V6" stroke="#fff" stroke-width="2"/></pattern></defs>
    <path d="M26 232L454 232" fill="none" stroke="currentColor" opacity=".22"/>
    <rect x="41" y="196.16" width="52" height="35.84" fill="#214e49"/>
