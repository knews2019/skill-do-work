<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 284" role="img" aria-labelledby="title desc">
  <title id="title">Monthly bike repairs</title>
  <desc id="desc">Sample data. Stacked repair totals grow from 30 in January to 58 in April. May is partial.</desc>
