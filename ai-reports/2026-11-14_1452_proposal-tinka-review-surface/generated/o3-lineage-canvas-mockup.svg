<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="mockup-title" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="mockup-title">MOCKUP — proposal. One canvas per report lineage: columns follow the second-opinion tree id, rows follow the revision chain, and a push, pull flow runs below.</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L10 5L0 10z" fill="#56607f"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="698" rx="16" fill="#f5f7ff" stroke="#d6dcf0" stroke-width="2"/>

  <rect x="24" y="20" width="218" height="34" rx="8" fill="#6a4cf0"/>
  <text x="38" y="43" font-size="16" font-weight="800" fill="#ffffff">MOCKUP — proposal</text>
  <text x="260" y="43" font-size="18" font-weight="800" fill="#18203a">One canvas per report lineage (O3 layout)</text>
  <text x="24" y="78" font-size="13" fill="#56607f">Columns follow the second-opinion tree id. Rows follow the revision chain. Every tile is a copy; no HTML is served.</text>

  <!-- column headers -->
  <g font-size="14" font-weight="700" fill="#18203a">
    <text x="230" y="110">v1 · original page</text>
    <text x="540" y="110">v1c01 · first child</text>
    <text x="850" y="110">v1c02 · second child</text>
  </g>

  <!-- row labels -->
  <g fill="#18203a">
    <text x="24" y="150" font-size="14" font-weight="700">Revision 0</text>
    <text x="24" y="170" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#56607f">2026-11-04_1524_…</text>
    <text x="24" y="186" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#56607f">review-workflows</text>
    <text x="24" y="390" font-size="14" font-weight="700">Revision 1</text>
    <text x="24" y="410" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#56607f">2026-11-04_1747_…</text>
    <text x="24" y="426" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#56607f">review-workflows-rev1</text>
    <text x="24" y="446" font-size="11" fill="#56607f">supersedes revision 0</text>
  </g>
  <path d="M110 352 V208" stroke="#56607f" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow)"/>

  <!-- row 1 -->
  <g>
    <rect x="230" y="130" width="280" height="120" rx="12" fill="#ffffff" stroke="#1f6fe5" stroke-width="2"/>
    <text x="244" y="154" font-size="13" font-weight="700" fill="#18203a">PNG capture</text>
    <text x="244" y="174" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#56607f">index.html</text>
    <rect x="244" y="186" width="252" height="8" rx="4" fill="#d6dcf0"/><rect x="244" y="202" width="200" height="8" rx="4" fill="#d6dcf0"/><rect x="244" y="218" width="230" height="8" rx="4" fill="#d6dcf0"/>

    <rect x="540" y="130" width="280" height="120" rx="12" fill="#ffffff" stroke="#1f6fe5" stroke-width="2"/>
    <text x="554" y="154" font-size="13" font-weight="700" fill="#18203a">PNG capture</text>
    <text x="554" y="174" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#56607f">index-v1c01-codex-….html</text>
    <rect x="554" y="186" width="252" height="8" rx="4" fill="#d6dcf0"/><rect x="554" y="202" width="200" height="8" rx="4" fill="#d6dcf0"/><rect x="554" y="218" width="230" height="8" rx="4" fill="#d6dcf0"/>
    <rect x="540" y="262" width="280" height="56" rx="12" fill="#ffffff" stroke="#6a4cf0" stroke-width="2"/>
    <text x="554" y="286" font-size="13" font-weight="700" fill="#18203a">reply.md · Markdown tile</text>
    <text x="554" y="304" font-size="11" fill="#56607f">quote comments work here</text>

    <rect x="850" y="130" width="280" height="120" rx="12" fill="none" stroke="#d6dcf0" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="864" y="194" font-size="12" fill="#56607f">no v1c02 in this revision</text>
  </g>

  <!-- row 2 -->
  <g>
    <rect x="230" y="370" width="280" height="120" rx="12" fill="#ffffff" stroke="#1f6fe5" stroke-width="2"/>
    <text x="244" y="394" font-size="13" font-weight="700" fill="#18203a">PNG capture</text>
    <text x="244" y="414" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#56607f">index.html</text>
    <rect x="244" y="426" width="252" height="8" rx="4" fill="#d6dcf0"/><rect x="244" y="442" width="200" height="8" rx="4" fill="#d6dcf0"/><rect x="244" y="458" width="230" height="8" rx="4" fill="#d6dcf0"/>
    <rect x="432" y="378" width="66" height="22" rx="11" fill="#fff4d6" stroke="#e08a00"/>
    <text x="446" y="393" font-size="11" font-weight="700" fill="#18203a">1 note</text>

    <rect x="540" y="370" width="280" height="120" rx="12" fill="#ffffff" stroke="#1f6fe5" stroke-width="2"/>
    <text x="554" y="394" font-size="13" font-weight="700" fill="#18203a">PNG capture</text>
    <text x="554" y="414" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#56607f">index-v1c01-codex-….html</text>
    <rect x="554" y="426" width="252" height="8" rx="4" fill="#d6dcf0"/><rect x="554" y="442" width="200" height="8" rx="4" fill="#d6dcf0"/><rect x="554" y="458" width="230" height="8" rx="4" fill="#d6dcf0"/>
    <rect x="540" y="502" width="280" height="56" rx="12" fill="#ffffff" stroke="#6a4cf0" stroke-width="2"/>
    <text x="554" y="526" font-size="13" font-weight="700" fill="#18203a">reply.md · Markdown tile</text>
    <text x="554" y="544" font-size="11" fill="#56607f">copy checked by sha256</text>

    <rect x="850" y="370" width="280" height="120" rx="12" fill="#ffffff" stroke="#1f6fe5" stroke-width="2"/>
    <text x="864" y="394" font-size="13" font-weight="700" fill="#18203a">PNG capture</text>
    <text x="864" y="414" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#56607f">index-v1c02-agy-….html</text>
    <rect x="864" y="426" width="252" height="8" rx="4" fill="#d6dcf0"/><rect x="864" y="442" width="200" height="8" rx="4" fill="#d6dcf0"/><rect x="864" y="458" width="230" height="8" rx="4" fill="#d6dcf0"/>
    <rect x="1052" y="378" width="66" height="22" rx="11" fill="#fff4d6" stroke="#e08a00"/>
    <text x="1066" y="393" font-size="11" font-weight="700" fill="#18203a">★ star</text>
    <rect x="850" y="502" width="280" height="56" rx="12" fill="#ffffff" stroke="#6a4cf0" stroke-width="2"/>
    <text x="864" y="526" font-size="13" font-weight="700" fill="#18203a">reply.md · Markdown tile</text>
    <text x="864" y="544" font-size="11" fill="#56607f">1 comment on a quote</text>
  </g>

  <text x="230" y="584" font-size="11" fill="#56607f">Tile id = hash of bundle folder name plus page, so a second push changes nothing and a month move keeps the id.</text>

  <!-- flow -->
  <g font-size="13" fill="#18203a">
    <rect x="24" y="612" width="210" height="60" rx="12" fill="#ffffff" stroke="#6a4cf0" stroke-width="2"/>
    <text x="38" y="637" font-weight="700">push</text><text x="38" y="656" font-size="12" fill="#56607f">copies PNG and reply.md</text>
    <path d="M236 642 H254" stroke="#56607f" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="258" y="612" width="210" height="60" rx="12" fill="#ffffff" stroke="#1f6fe5" stroke-width="2"/>
    <text x="272" y="637" font-weight="700">canvas in Tinka</text><text x="272" y="656" font-size="12" fill="#56607f">desk only, 127.0.0.1</text>
    <path d="M470 642 H488" stroke="#56607f" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="492" y="612" width="210" height="60" rx="12" fill="#ffffff" stroke="#6a4cf0" stroke-width="2"/>
    <text x="506" y="637" font-weight="700">pull</text><text x="506" y="656" font-size="12" fill="#56607f">reads star, note, comment</text>
    <path d="M704 642 H722" stroke="#56607f" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="726" y="612" width="210" height="60" rx="12" fill="#ffffff" stroke="#0f9d84" stroke-width="2"/>
    <text x="740" y="637" font-weight="700">feedback snapshot</text><text x="740" y="656" font-size="12" fill="#56607f">dated, verbatim, quoted data</text>
    <path d="M938 642 H956" stroke="#56607f" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="960" y="612" width="216" height="60" rx="12" fill="#ffffff" stroke="#0f9d84" stroke-width="2"/>
    <text x="974" y="637" font-weight="700">proposed commands</text><text x="974" y="656" font-size="12" fill="#56607f">printed; you approve each</text>
  </g>
</svg>
